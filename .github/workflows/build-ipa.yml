name: build-ipa
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project Hermes.xcodeproj -scheme Hermes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
      - name: Assert built Info.plist
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          plutil -p "$APP/Info.plist" | tee plist.txt
          grep -q "UIApplicationSceneManifest" plist.txt
          grep -q "top.thewhome.hermes" plist.txt
          grep -q "Hermes" plist.txt
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../Hermes-unsigned.ipa Payload
          cd .. && ls -lh Hermes-unsigned.ipa && unzip -l Hermes-unsigned.ipa | head -25
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-unsigned-ipa
          path: Hermes-unsigned.ipa
          if-no-files-found: error
